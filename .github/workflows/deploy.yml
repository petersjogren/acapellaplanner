name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual redeploy from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN needs write access to Pages, and id-token for the deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Don't publish a build that is failing its own tests.
      - run: npm run lint
      - run: npm test

      # Fails with "Get Pages site failed ... Not Found" until Pages is enabled:
      # Settings -> Pages -> Source -> GitHub Actions. Self-enabling via the
      # `enablement` input needs a PAT, which is not worth a stored secret for a
      # one-time setting.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # base must match where Pages actually serves this site. configure-pages
      # reports it, so a rename of the repo does not silently 404 every asset.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
